[project]
name = "figure-tools"
version = "0.4.15"
description = ""
authors = [
    { name = "thaeber", email = "thomas.haeber@kit.edu" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.7.2",
    "environs>=9.5.0",
    "scipy>=1.13"
]

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "git-changelog>=2.11.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.black]
skip-string-normalization = true

[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"

[tool.bumpversion]
current_version = "0.4.15"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = true
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '''^version\s*=\s*([\'\"\`])({current_version})\1'''
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "figure_tools/version.py"

[[tool.bumpversion.files]]
filename = "test/test_version.py"

[tool.git-changelog]
convention = "angular"
in-place = false
output = "changelog.md"
provider = "github"
sections = "fix,feat,refactor,chore,style,build,test"
template = "angular"
